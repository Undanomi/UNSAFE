name: slsg-build

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: build_service
      POSTGRES_USER: build_service
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U build_service -d build_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  volume-init:
    image: postgres:17-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - install -d -o 10001 -g 10001 -m 0750 /scenarios/uploads /builds
    volumes:
      - scenario-data:/scenarios
      - build-data:/builds
    restart: "no"

  server:
    build:
      context: .
      target: server
    environment:
      DATABASE_URL: postgres://build_service:local-development-only@postgres:5432/build_service?sslmode=disable
      HTTP_ADDRESS: :8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-development-token}
      BUILD_ROOT: /var/lib/slsg/builds
      SCENARIO_ROOT: /var/lib/slsg/scenarios
    depends_on:
      postgres:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - build-data:/var/lib/slsg/builds:ro
      - scenario-data:/var/lib/slsg/scenarios
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://build_service:local-development-only@postgres:5432/build_service?sslmode=disable
      WORKER_ID: worker-1
      SCENARIO_ROOT: /var/lib/slsg/scenarios
      BUILD_ROOT: /var/lib/slsg/builds
      PACKER_TEMPLATE: /opt/slsg/packer/build.pkr.hcl
      PACKER_LOG: "1"
      BUILD_TIMEOUT: 2h
    depends_on:
      postgres:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    volumes:
      - scenario-data:/var/lib/slsg/scenarios:ro
      - ./builder/base_images:/opt/slsg/base_images:ro
      - build-data:/var/lib/slsg/builds
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID:-993}"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  scenario-data:
  build-data:
