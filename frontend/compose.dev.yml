services:
  frontend-postgres:
    environment:
      POSTGRES_PASSWORD: ${DEV_FRONTEND_POSTGRES_PASSWORD:?DEV_FRONTEND_POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${DEV_FRONTEND_POSTGRES_PORT:-5432}:5432"

  frontend-migrate:
    environment:
      DATABASE_URL: postgresql://frontend_service:${DEV_FRONTEND_POSTGRES_PASSWORD:?DEV_FRONTEND_POSTGRES_PASSWORD must be set}@frontend-postgres:5432/frontend_service

  frontend:
    environment:
      DATABASE_URL: postgresql://frontend_service:${DEV_FRONTEND_POSTGRES_PASSWORD:?DEV_FRONTEND_POSTGRES_PASSWORD must be set}@frontend-postgres:5432/frontend_service

networks:
  frontend-database:
    internal: false
