[project]
name = "ai-server"
version = "0.1.0"
description = "AI and scenario orchestration service for SLSG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0,<1",
    "fastapi>=0.116.0,<1",
    "httpx>=0.28.0,<1",
    "pydantic-settings>=2.10.0,<3",
    "pyyaml>=6.0.3,<7",
    "sqladmin[auth]>=0.29.0,<1",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.12.0,<1",
]

[project.scripts]
ai-server = "ai_server.main:run"
ai-server-skills = "ai_server.skills.cli:main"
ai-admin = "ai_server.admin_app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
