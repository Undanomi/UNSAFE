services:
  ai-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_service
      POSTGRES_USER: ai_service
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD:?AI_POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_service -d ai_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ai-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  ai-volume-init:
    image: postgres:17-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - install -d -o 10001 -g 10001 -m 0750 /scenarios
    volumes:
      - ai-scenario-data:/scenarios
    restart: "no"

  ai-server:
    build:
      context: .
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-65536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-65536}
      GENERATION_RETRIES: ${GENERATION_RETRIES:-3}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-600}
      AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-1}
      AI_REQUEST_MIN_INTERVAL_SECONDS: ${AI_REQUEST_MIN_INTERVAL_SECONDS:-1}
      AI_TRANSIENT_RETRY_ATTEMPTS: ${AI_TRANSIENT_RETRY_ATTEMPTS:-8}
      AI_TRANSIENT_RETRY_MAX_SECONDS: ${AI_TRANSIENT_RETRY_MAX_SECONDS:-600}
      AI_TRANSIENT_RETRY_JITTER_SECONDS: ${AI_TRANSIENT_RETRY_JITTER_SECONDS:-0.5}
      BUILD_TIMEOUT_SECONDS: ${BUILD_TIMEOUT_SECONDS:-30}
      CVE_MIN_YEAR: ${CVE_MIN_YEAR:-2024}
      SCENARIO_GENERATION_ATTEMPTS: ${SCENARIO_GENERATION_ATTEMPTS:-5}
      SCENARIO_CHUNK_SIZE: ${SCENARIO_CHUNK_SIZE:-320}
      SOURCE_GENERATION_ATTEMPTS: ${SOURCE_GENERATION_ATTEMPTS:-3}
      SCENARIO_SYNC_ATTEMPTS: ${SCENARIO_SYNC_ATTEMPTS:-3}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ROCKYOU_PATH: ${ROCKYOU_PATH:-/app/data/rockyou.txt}
      ROCKYOU_MIN_LINE: ${ROCKYOU_MIN_LINE:-100000}
      ROCKYOU_MAX_LINE: ${ROCKYOU_MAX_LINE:-200000}
      DATABASE_URL: postgresql://ai_service:${AI_POSTGRES_PASSWORD:?AI_POSTGRES_PASSWORD must be set}@ai-postgres:5432/ai_service
      SOURCE_ROOT: /var/lib/slsg/scenarios
      SKILLS_ENABLED: ${SKILLS_ENABLED:-true}
      SKILLS_MAX_ACTIVE: ${SKILLS_MAX_ACTIVE:-32}
      SKILLS_MAX_PER_PHASE: ${SKILLS_MAX_PER_PHASE:-8}
      SKILL_CONTEXT_MAX_CHARS: ${SKILL_CONTEXT_MAX_CHARS:-50000}
      SKILL_SELECTION_MAX_CHARS: ${SKILL_SELECTION_MAX_CHARS:-60000}
      SKILL_SELECTION_RETRIES: ${SKILL_SELECTION_RETRIES:-2}
      SKILL_SELECTION_MAX_CVES: ${SKILL_SELECTION_MAX_CVES:-3}
      # Use a Compose-specific override so a host-side BUILD_SERVER_URL such as
      # http://localhost:8080 cannot leak into the container network.
      BUILD_SERVER_URL: ${AI_BUILD_SERVER_URL:-http://server:8080}
      BUILD_SERVER_TOKEN: ${BUILD_SERVER_TOKEN:?BUILD_SERVER_TOKEN must be set}
      BUILD_REPAIR_MAX_ATTEMPTS: ${BUILD_REPAIR_MAX_ATTEMPTS:-3}
      MAX_ACTIVE_SESSIONS_PER_USER: ${MAX_ACTIVE_SESSIONS_PER_USER:-1}
      SOURCE_SANDBOX_ENABLED: ${SOURCE_SANDBOX_ENABLED:-true}
      SOURCE_SANDBOX_URL: ${SOURCE_SANDBOX_URL:-http://source-sandbox:8090}
      SOURCE_SANDBOX_TOKEN: ${SOURCE_SANDBOX_TOKEN:-local-development-source-sandbox-token-change-me}
      SOURCE_WORKBENCH_ACTION_LIMIT: ${SOURCE_WORKBENCH_ACTION_LIMIT:-20}
      SOURCE_SANDBOX_TIMEOUT_SECONDS: ${SOURCE_SANDBOX_TIMEOUT_SECONDS:-660}
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:-local-development-download-signing-secret-change-me}
      DOWNLOAD_URL_TTL_SECONDS: ${DOWNLOAD_URL_TTL_SECONDS:-1800}
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-volume-init:
        condition: service_completed_successfully
      source-sandbox:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ai-scenario-data:/var/lib/slsg/scenarios
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  source-sandbox:
    image: slsg-source-sandbox:local
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    command:
      - uvicorn
      - ai_server.sandbox_app:create_sandbox_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    environment:
      SOURCE_SANDBOX_TOKEN: ${SOURCE_SANDBOX_TOKEN:-local-development-source-sandbox-token-change-me}
      SOURCE_SANDBOX_EXECUTION_IMAGE: ${SOURCE_SANDBOX_EXECUTION_IMAGE:-debian:13-slim}
      SOURCE_SANDBOX_COMMAND_TIMEOUT_SECONDS: ${SOURCE_SANDBOX_COMMAND_TIMEOUT_SECONDS:-600}
      SOURCE_SANDBOX_MAX_CONCURRENT: ${SOURCE_SANDBOX_MAX_CONCURRENT:-2}
      SOURCE_SANDBOX_QUEUE_CAPACITY: ${SOURCE_SANDBOX_QUEUE_CAPACITY:-100}
      SOURCE_SANDBOX_SESSION_TTL_SECONDS: ${SOURCE_SANDBOX_SESSION_TTL_SECONDS:-900}
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 180s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ai-admin:
    build:
      context: .
    profiles: ["admin"]
    command:
      - uvicorn
      - ai_server.admin_app:create_admin_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      DATABASE_URL: postgresql://ai_service:${AI_POSTGRES_PASSWORD:?AI_POSTGRES_PASSWORD must be set}@ai-postgres:5432/ai_service
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-65536}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-65536}
      GENERATION_RETRIES: ${GENERATION_RETRIES:-3}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-600}
      AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-1}
      AI_REQUEST_MIN_INTERVAL_SECONDS: ${AI_REQUEST_MIN_INTERVAL_SECONDS:-1}
      AI_TRANSIENT_RETRY_ATTEMPTS: ${AI_TRANSIENT_RETRY_ATTEMPTS:-8}
      AI_TRANSIENT_RETRY_MAX_SECONDS: ${AI_TRANSIENT_RETRY_MAX_SECONDS:-600}
      AI_TRANSIENT_RETRY_JITTER_SECONDS: ${AI_TRANSIENT_RETRY_JITTER_SECONDS:-0.5}
      BUILD_TIMEOUT_SECONDS: ${BUILD_TIMEOUT_SECONDS:-30}
      CVE_MIN_YEAR: ${CVE_MIN_YEAR:-2024}
      SCENARIO_GENERATION_ATTEMPTS: ${SCENARIO_GENERATION_ATTEMPTS:-5}
      SCENARIO_CHUNK_SIZE: ${SCENARIO_CHUNK_SIZE:-320}
      SOURCE_GENERATION_ATTEMPTS: ${SOURCE_GENERATION_ATTEMPTS:-3}
      SCENARIO_SYNC_ATTEMPTS: ${SCENARIO_SYNC_ATTEMPTS:-3}
      BUILD_REPAIR_MAX_ATTEMPTS: ${BUILD_REPAIR_MAX_ATTEMPTS:-3}
      MAX_ACTIVE_SESSIONS_PER_USER: ${MAX_ACTIVE_SESSIONS_PER_USER:-1}
      DOWNLOAD_URL_TTL_SECONDS: ${DOWNLOAD_URL_TTL_SECONDS:-1800}
      SKILLS_MAX_ACTIVE: ${SKILLS_MAX_ACTIVE:-32}
      SKILLS_MAX_PER_PHASE: ${SKILLS_MAX_PER_PHASE:-8}
      SKILL_CONTEXT_MAX_CHARS: ${SKILL_CONTEXT_MAX_CHARS:-50000}
      SKILL_SELECTION_MAX_CHARS: ${SKILL_SELECTION_MAX_CHARS:-60000}
      SKILL_SELECTION_RETRIES: ${SKILL_SELECTION_RETRIES:-2}
      SKILL_SELECTION_MAX_CVES: ${SKILL_SELECTION_MAX_CVES:-3}
      SQLADMIN_USERNAME: ${SQLADMIN_USERNAME:-}
      SQLADMIN_PASSWORD: ${SQLADMIN_PASSWORD:-}
      SQLADMIN_SESSION_SECRET: ${SQLADMIN_SESSION_SECRET:-}
      SQLADMIN_SECURE_COOKIES: ${SQLADMIN_SECURE_COOKIES:-false}
    depends_on:
      ai-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  ai-postgres-data:
  ai-scenario-data:
